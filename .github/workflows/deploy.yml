name: Deploy to InfinityFree

# InfinityFree restricts PHP file access to the website's htdocs directory.
# Keep the full Laravel project in htdocs and route requests through public/.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview the FTP changes without uploading files
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: infinityfree-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, tokenizer, xml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install production dependencies
        run: |
          composer install --no-dev --no-interaction --prefer-dist
          composer dump-autoload --no-dev --no-interaction --optimize=false

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare Laravel project inside htdocs
        run: |
          mkdir -p /tmp/rescueph-deploy/htdocs
          rsync -a ./ /tmp/rescueph-deploy/htdocs/ \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.env*' \
            --exclude='/tmp/rescueph-deploy/' \
            --exclude='/node_modules/' \
            --exclude='/tests/' \
            --exclude='/scripts/' \
            --exclude='/tmp-*.php' \
            --exclude='/rescueph_schema.sql' \
            --exclude='/database/database.sqlite' \
            --exclude='/storage/***' \
            --exclude='/.phpunit*' \
            --exclude='/.editorconfig' \
            --exclude='/.gitattributes' \
            --exclude='/.gitignore' \
            --exclude='/.dockerignore'
          for dir in \
            bootstrap/cache \
            storage/app/private \
            storage/app/public \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/testing \
            storage/framework/views \
            storage/logs; do
            mkdir -p "/tmp/rescueph-deploy/htdocs/$dir"
            touch "/tmp/rescueph-deploy/htdocs/$dir/.keep"
          done
          cat > /tmp/rescueph-deploy/htdocs/.htaccess <<'HTACCESS'
          RewriteEngine On
          RewriteRule ^storage/(.*)$ /storage/app/public/$1 [END]
          RewriteRule (.*) /public/$1 [L]
          HTACCESS

      - name: Validate deployment layout
        run: |
          test -f /tmp/rescueph-deploy/htdocs/artisan || { echo "::error::Laravel artisan file is missing from the htdocs bundle."; exit 1; }
          test -f /tmp/rescueph-deploy/htdocs/composer.json || { echo "::error::Composer manifest is missing from the htdocs bundle."; exit 1; }
          test -f /tmp/rescueph-deploy/htdocs/vendor/autoload.php || { echo "::error::Composer dependencies are missing from the htdocs bundle."; exit 1; }
          test -f /tmp/rescueph-deploy/htdocs/public/index.php || { echo "::error::Laravel public front controller is missing."; exit 1; }
          grep -Fq 'RewriteRule (.*) /public/$1 [L]' /tmp/rescueph-deploy/htdocs/.htaccess || { echo "::error::htdocs rewrite to Laravel public is missing."; exit 1; }
          grep -Fq 'RewriteRule ^storage/(.*)$ /storage/app/public/$1 [END]' /tmp/rescueph-deploy/htdocs/.htaccess || { echo "::error::Public storage rewrite is missing."; exit 1; }
          test ! -e /tmp/rescueph-deploy/htdocs/.env || { echo "::error::A local .env file must never be included in the deployment bundle."; exit 1; }
          oversized_php=$(find /tmp/rescueph-deploy/htdocs -type f -name '*.php' -size +1M -print -quit)
          test -z "$oversized_php" || { echo "::error::InfinityFree may reject PHP files larger than 1 MB: $oversized_php"; exit 1; }

      - name: Upload Laravel project to htdocs
        uses: SamKirkland/FTP-Deploy-Action@3a9c65ae0fc12ac924ccef8afc26941cc43aad0b
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: /tmp/rescueph-deploy/htdocs/
          server-dir: /htdocs/
          dry-run: ${{ inputs.dry_run }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
